name: Enterprise ITSM CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  packages: write

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate FastAPI Python syntax & imports
        working-directory: ./api
        run: |
          pip install -r requirements.txt
          python -m py_compile main.py database.py core/*.py models/*.py services/*.py routers/*.py
      - name: Test Docker Compose build
        run: |
          mkdir -p config
          touch config/db.env config/app.env
          docker compose build
